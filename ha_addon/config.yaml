name: "Intra Habitica Bridge"
version: "0.2.1"
slug: "intra_habitica_bridge"
description: "SkoleIntra homework and calendar packing lists as Habitica tasks, per kid"
url: "https://github.com/bymem/intra-habitica-bridge"

arch:
  - aarch64
  - amd64

# Node handles its own SIGTERM/SIGINT; the Supervisor's init wrapper would only
# get in the way.
init: false
startup: application
boot: auto

# The parent dashboard is served through Ingress, so Home Assistant handles
# authentication and nothing is published to the network. No ports: there is
# no kid-facing surface, kids use Habitica's own app.
ingress: true
ingress_port: 8099
panel_icon: "mdi:sword-cross"
panel_title: "Habitica"

# Grants Core API access through the Supervisor proxy and injects
# SUPERVISOR_TOKEN — every Habitica call goes through HA's own Habitica
# integration actions, and calendars are read from the Core API. Nothing broader.
homeassistant_api: true

options:
  # SkoleIntra homework poll: weekdays 06:00, 13:00, 17:00.
  poll_cron: "0 6,13,17 * * 1-5"
  # Calendar -> packing-list checklist, nightly.
  packing_cron: "0 1 * * *"
  # Recreate-on-delete and streak-drop check, hourly.
  watchdog_cron: "15 * * * *"
  log_level: "info"
  skoleintra:
    base_url: "https://SCHOOL.m.skoleintra.dk"
    username: ""
    password: ""
  # Refuses a poll that would rewrite most tracked homework at once — the
  # signature of a scrape/parse regression rather than real teacher edits.
  sanity_brake:
    enabled: true
    min_changes: 3
    max_change_ratio: 0.5
  children:
    - slug: "child-one"
      name: "Child One"
      skoleintra_child_path: "parent/0000/NameOne"
      calendar_entity: ""
      habitica_config_entry: ""
      homework_difficulty: "medium"
      packing_difficulty: "trivial"

schema:
  poll_cron: "str"
  packing_cron: "str"
  watchdog_cron: "str"
  log_level: "list(error|warn|info|debug)"
  skoleintra:
    base_url: "url"
    username: "str"
    password: "password"
  sanity_brake:
    enabled: "bool"
    min_changes: "int(1,)"
    max_change_ratio: "float(0.0,1.0)"
  children:
    - slug: "str"
      name: "str"
      # Leave blank to skip homework sync for this kid.
      skoleintra_child_path: "str?"
      # Leave blank to skip the packing-list Daily for this kid.
      calendar_entity: "str?"
      # Config entry ID of this kid's Habitica integration entry
      # (Settings → Devices & services → Habitica). Required — the dashboard
      # can target any configured kid regardless of the two settings above.
      habitica_config_entry: "str"
      homework_difficulty: "list(trivial|easy|medium|hard)"
      packing_difficulty: "list(trivial|easy|medium|hard)"
